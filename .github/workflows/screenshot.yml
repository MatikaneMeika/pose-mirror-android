name: UI screenshots

# Manual-only: captures the key screens on an emulator for UI review.
# Trigger from the branch under review, e.g.:
#   gh workflow run screenshot.yml --ref ui-review
# discovery touch
on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Download pose model into assets
        run: bash tools/download_model.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew tools/ci_screenshots.sh
          ./gradlew assembleDebug

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: bash tools/ci_screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
