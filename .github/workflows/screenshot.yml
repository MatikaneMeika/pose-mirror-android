name: UI screenshots

# Captures the key screens on an emulator for UI review.
#
# Triggers:
# - workflow_dispatch: manual runs from any branch that has this file
#   (e.g. `gh workflow run screenshot.yml --ref ui-review`).
# - push to ui-review: automatic re-capture after each fix round.
#   NOTE: workflow_dispatch alone cannot discover a workflow file that exists
#   only on a non-default branch (GitHub returns 404), so the push trigger is
#   what actually fires the runs during review. main is never touched.
on:
  workflow_dispatch:
  push:
    branches: [ui-review]

jobs:
  screenshot:
    # NOTE (2026-09-26): free runners currently offer no usable hardware
    # acceleration for the emulator — ubuntu-latest has no /dev/kvm (the
    # action launched with `-accel off`) and macos-latest fails with
    # `HVF error: HV_UNSUPPORTED`. We therefore boot the lightest viable AVD
    # (API 28 >= minSdk 26, AOSP `default` target without Play services)
    # under software emulation with a generous boot timeout. Screenshots
    # remain real-device renders; Material3/edge-to-edge visuals are
    # representative for UI review.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0

      - name: Download pose model into assets
        run: bash tools/download_model.sh

      - name: Build debug APK
        run: |
          chmod +x gradlew tools/ci_screenshots.sh
          ./gradlew assembleDebug

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Lightest viable AVD for software-emulated boot: API 28 is above
          # minSdk 26 and the AOSP `default` target skips Play services.
          # 1200s boot timeout — TCG software emulation is slow.
          api-level: 28
          target: default
          arch: x86_64
          # Leaner boot: skip snapshot load/save, boot animation and audio.
          # (Animations stay enabled on the device — the app gates its own
          # motion on the system animator setting, which we want to review.)
          emulator-options: -no-snapshot -no-boot-anim -no-audio
          emulator-boot-timeout: 1200
          script: bash tools/ci_screenshots.sh

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: screenshots/
